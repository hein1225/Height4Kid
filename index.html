<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海因成长助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-primary: #FF9A9E;
            --pink-secondary: #FECFEF;
            --pink-bg: #FFF0F5;
            --blue-primary: #74B9FF;
            --blue-secondary: #A8D8FF;
            --blue-bg: #F0F8FF;
            --text-dark: #2D3436;
            --text-light: #636E72;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        body.theme-blue {
            background: linear-gradient(135deg, #F0F8FF 0%, #E3F2FD 100%);
        }

        .phone-frame {
            width: 100%;
            max-width: 430px;
            height: 932px;
            background: var(--white);
            border-radius: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .back-btn, .camera-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .back-btn:hover, .camera-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }

        .back-btn svg, .camera-btn svg {
            width: 24px;
            height: 24px;
            color: var(--text-dark);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            padding: 0 24px 20px;
            flex: 1;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 420px;
            background: linear-gradient(180deg, #FFE4E8 0%, #FFF0F5 50%, #FFFFFF 100%);
            border-radius: 0 0 40px 40px;
            overflow: hidden;
        }

        body.theme-blue .hero-bg {
            background: linear-gradient(180deg, #E3F2FD 0%, #F0F8FF 50%, #FFFFFF 100%);
        }

        .cloud {
            position: absolute;
            background: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%);
            border-radius: 50%;
            opacity: 0.9;
            animation: float 8s ease-in-out infinite;
            box-shadow: 0 8px 20px rgba(200, 200, 200, 0.3);
        }

        .cloud-1 {
            width: 120px;
            height: 70px;
            top: 35px;
            right: 25px;
            animation-delay: 0s;
        }

        .cloud-2 {
            width: 85px;
            height: 55px;
            top: 75px;
            left: 35px;
            animation-delay: 3s;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%);
            border-radius: 50%;
        }

        .cloud-1::before {
            width: 70px;
            height: 70px;
            top: -30px;
            left: 15px;
        }

        .cloud-1::after {
            width: 58px;
            height: 58px;
            top: -20px;
            right: 15px;
        }

        .cloud-2::before {
            width: 55px;
            height: 55px;
            top: -22px;
            left: 10px;
        }

        .cloud-2::after {
            width: 48px;
            height: 48px;
            top: -15px;
            right: 8px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .star {
            position: absolute;
            width: 24px;
            height: 24px;
            animation: twinkle 2s ease-in-out infinite;
        }

        .star-1 { top: 120px; left: 60px; animation-delay: 0.5s; }
        .star-2 { top: 100px; right: 80px; animation-delay: 1s; }
        .star-3 { top: 160px; right: 50px; animation-delay: 1.5s; }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .hero-content {
            position: relative;
            z-index: 5;
            padding-top: 10px;
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }

        .avatar-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
        }

        .character-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .character-container {
            position: relative;
            width: 280px;
            height: 300px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .character-container::before {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(ellipse at center, rgba(255, 154, 158, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        body.theme-blue .character-container::before {
            background: radial-gradient(ellipse at center, rgba(116, 185, 255, 0.15) 0%, transparent 70%);
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 70px;
            background: linear-gradient(180deg, #FFE4E8 0%, #FFD4D9 50%, #FFC9CF 100%);
            border-radius: 50%;
            box-shadow: 0 -5px 20px rgba(255, 196, 200, 0.4);
        }

        body.theme-blue .ground {
            background: linear-gradient(180deg, #E1F5FE 0%, #BBDEFB 50%, #90CAF9 100%);
            box-shadow: 0 -5px 20px rgba(144, 202, 249, 0.4);
        }

        .grass {
            position: absolute;
            bottom: 35px;
            width: 14px;
            height: 26px;
            background: linear-gradient(180deg, #A5D6A7 0%, #81C784 50%, #66BB6A 100%);
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            box-shadow: 0 2px 4px rgba(102, 187, 106, 0.3);
        }

        .grass-1 { left: 35px; transform: rotate(-18deg); animation: sway1 3s ease-in-out infinite; }
        .grass-2 { left: 55px; transform: rotate(-5deg); animation: sway2 3s ease-in-out infinite 0.5s; }
        .grass-3 { right: 45px; transform: rotate(18deg); animation: sway3 3s ease-in-out infinite 1s; }
        .grass-4 { right: 25px; transform: rotate(5deg); animation: sway4 3s ease-in-out infinite 1.5s; }

        @keyframes sway1 {
            0%, 100% { transform: rotate(-18deg); }
            50% { transform: rotate(-13deg); }
        }

        @keyframes sway2 {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(0deg); }
        }

        @keyframes sway3 {
            0%, 100% { transform: rotate(18deg); }
            50% { transform: rotate(23deg); }
        }

        @keyframes sway4 {
            0%, 100% { transform: rotate(5deg); }
            50% { transform: rotate(10deg); }
        }

        .character-illustration {
            position: relative;
            z-index: 2;
            width: 220px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.12));
        }

        /* Data Tags */
        .data-tags {
            position: absolute;
            z-index: 10;
        }

        .height-tag {
            right: -50px;
            top: 40px;
        }

        .weight-tag {
            left: -50px;
            top: 140px;
        }

        .data-tag {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .data-tag-icon {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--pink-primary);
        }

        body.theme-blue .data-tag-icon {
            background: var(--blue-primary);
        }

        .data-tag-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .data-tag-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--pink-primary);
        }

        body.theme-blue .data-tag-value {
            color: var(--blue-primary);
        }

        /* Chart Section */
        .chart-section {
            padding: 0 24px 20px;
            position: relative;
            z-index: 10;
        }

        .chart-card {
            background: white;
            border-radius: 30px;
            padding: 20px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        /* 书签标签样式 */
        .chart-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .chart-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 20px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chart-tab:hover {
            background: #e8e8e8;
        }

        .chart-tab.active {
            background: linear-gradient(135deg, rgba(255, 154, 158, 0.2), rgba(254, 207, 239, 0.2));
            border: 2px solid var(--pink-primary);
        }

        body.theme-blue .chart-tab.active {
            background: linear-gradient(135deg, rgba(116, 185, 255, 0.2), rgba(168, 216, 255, 0.2));
            border: 2px solid var(--blue-primary);
        }

        .chart-tab span {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .chart-tab-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--pink-primary);
        }

        body.theme-blue .chart-dot {
            background: var(--blue-primary);
        }

        .chart-title-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .chart-subtitle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-light);
        }

        .chart-subtitle-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #AED581;
        }

        /* Chart */
        .chart-container {
            height: 180px;
            position: relative;
            padding-top: 20px;
        }

        .chart-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 30px;
        }

        .chart-grid-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: #E8E8E8;
            border-bottom: 1px dashed #E0E0E0;
        }

        .chart-grid-line:nth-child(1) { top: 0; }
        .chart-grid-line:nth-child(2) { top: 25%; }
        .chart-grid-line:nth-child(3) { top: 50%; }
        .chart-grid-line:nth-child(4) { top: 75%; }

        .chart-y-label {
            position: absolute;
            left: 0;
            font-size: 12px;
            color: #B0B0B0;
            transform: translateY(-50%);
        }

        .chart-y-label:nth-child(1) { top: 0; }
        .chart-y-label:nth-child(2) { top: 20%; }
        .chart-y-label:nth-child(3) { top: 40%; }
        .chart-y-label:nth-child(4) { top: 60%; }
        .chart-y-label:nth-child(5) { top: 80%; }
        .chart-y-label:nth-child(6) { top: 100%; }

        .chart-line-container {
            position: absolute;
            top: 0;
            left: 40px;
            right: 0;
            bottom: 30px;
        }

        .chart-svg {
            width: 100%;
            height: 100%;
        }

        .chart-area {
            fill: url(#gradient);
            opacity: 0.3;
        }

        .chart-line {
            fill: none;
            stroke: var(--pink-primary);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        body.theme-blue .chart-line {
            stroke: var(--blue-primary);
        }

        .chart-point {
            fill: var(--pink-primary);
            stroke: white;
            stroke-width: 3;
        }

        body.theme-blue .chart-point {
            fill: var(--blue-primary);
        }

        .chart-point-highlight {
            fill: #FFD54F;
            stroke: white;
            stroke-width: 4;
        }

        .chart-x-labels {
            position: absolute;
            bottom: 0;
            left: 40px;
            right: 0;
            height: 20px;
        }

        .chart-x-label {
            font-size: 11px;
            color: #B0B0B0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: white;
            padding: 12px 24px 24px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 20;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F8F8F8;
            border-radius: 30px;
            padding: 8px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .nav-btn.active {
            background: white;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .add-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-primary) 0%, var(--pink-secondary) 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.4);
            transition: all 0.3s ease;
            margin: 0 12px;
        }

        body.theme-blue .add-btn {
            background: linear-gradient(135deg, var(--blue-primary) 0%, var(--blue-secondary) 100%);
            box-shadow: 0 8px 25px rgba(116, 185, 255, 0.4);
        }

        .add-btn:hover {
            transform: scale(1.1);
        }

        .add-btn svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        /* Page transitions */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* Record Page */
        .record-page {
            padding: 0 24px;
        }

        .record-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 24px;
            padding: 0 24px;
        }

        .record-form {
            background: white;
            border-radius: 30px;
            padding: 28px 24px;
            margin: 0 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 12px;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #F0F0F0;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.3s ease;
            background: #FAFAFA;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--pink-primary);
            background: white;
        }

        body.theme-blue .form-input:focus {
            border-color: var(--blue-primary);
        }

        .form-input-row {
            display: flex;
            gap: 16px;
        }

        .form-input-wrapper {
            flex: 1;
            position: relative;
        }

        .form-unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 15px;
        }

        .save-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--pink-primary) 0%, var(--pink-secondary) 100%);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            margin-top: 12px;
        }

        body.theme-blue .save-btn {
            background: linear-gradient(135deg, var(--blue-primary) 0%, var(--blue-secondary) 100%);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.4);
        }

        body.theme-blue .save-btn:hover {
            box-shadow: 0 8px 25px rgba(116, 185, 255, 0.4);
        }

        /* History Page */
        .history-page {
            padding: 0 24px;
        }

        .history-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            padding: 0 24px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 20px;
        }

        .history-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .history-date {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .history-data {
            display: flex;
            gap: 24px;
        }

        .history-data-item {
            text-align: right;
        }

        .history-data-label {
            font-size: 12px;
            color: var(--text-light);
        }

        .history-data-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--pink-primary);
        }

        body.theme-blue .history-data-value {
            color: var(--blue-primary);
        }

        /* Kids Page */
        .kids-page {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .kids-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .kid-item {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .kid-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .kid-item.selected {
            border-color: var(--pink-primary);
        }

        body.theme-blue .kid-item.selected {
            border-color: var(--blue-primary);
        }

        .kid-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-primary) 0%, var(--pink-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.theme-blue .kid-avatar {
            background: linear-gradient(135deg, var(--blue-primary) 0%, var(--blue-secondary) 100%);
        }

        .kid-avatar svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .kid-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .kid-info {
            flex: 1;
        }

        .kid-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .kid-details {
            font-size: 14px;
            color: var(--text-light);
            display: flex;
            gap: 16px;
        }

        .kid-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kid-detail-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-light);
        }

        .kid-actions {
            display: flex;
            gap: 8px;
        }

        .kid-action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .kid-action-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

                transform: translateY(20px);

            to {

                transform: translateY(0);

            color: var(--text-dark);

            left: 0;

        function calculateAge(birthday) {
            const birth = new Date(birthday);
            const today = new Date();
            let years = today.getFullYear() - birth.getFullYear();
            let months = today.getMonth() - birth.getMonth();
            let days = today.getDate() - birth.getDate();
            
            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            if (years > 0) {
                return `${years}岁${months}月`;
            }
            return `${months}月${days}天`;
        }

        // 计算年龄（月份）
        function calculateAgeInMonths(birthDate, recordDate) {
            const birth = new Date(birthDate);
            const record = new Date(recordDate);
            let months = (record.getFullYear() - birth.getFullYear()) * 12;
            months += record.getMonth() - birth.getMonth();
            if (record.getDate() < birth.getDate()) {
                months--;
            }
            return Math.max(0, months);
        }

        // 格式化年龄显示
        function formatAge(months) {
            if (months < 12) {
                return `${months}月`;
            } else {
                const years = Math.floor(months / 12);
                const remainingMonths = months % 12;
                if (remainingMonths === 0) {
                    return `${years}岁`;
                } else {
                    return `${years}岁${remainingMonths}月`;
                }
            }
        }

        // 获取指定年龄和国标的值（插值计算）
        function getStandardValue(gender, type, ageInYears, level) {
            const standards = gender === 'blue' ? nationalStandards.boy : nationalStandards.girl;
            const data = type === 'height' ? standards.height : standards.weight;
            
            // 找到相邻的年龄点
            let lowerAge = Math.floor(ageInYears);
            let upperAge = Math.ceil(ageInYears);
            lowerAge = Math.max(1, lowerAge);
            upperAge = Math.min(18, upperAge);
            
            if (lowerAge === upperAge) {
                return data[lowerAge][level];
            }
            
            // 插值计算
            const lowerData = data[lowerAge];
            const upperData = data[upperAge];
            const t = (ageInYears - lowerAge) / (upperAge - lowerAge);
            
            return lowerData[level] + (upperData[level] - lowerData[level]) * t;
        }

        // 渲染图表
        function renderChart(records, type) {
            const svg = document.getElementById('chart-svg');
            const container = svg.parentElement;
            const containerWidth = container.clientWidth || 300;
            const containerHeight = 150;
            const padding = 20;
            
            // 获取当前孩子的出生日期和性别
            const kid = kids.find(k => k.id === currentKidId);
            if (!kid) return;
            const gender = kid.gender;
            
            // 计算当前年龄
            const currentAgeInMonths = calculateAgeInMonths(kid.birthday, new Date().toISOString().split('T')[0]);
            const currentAge = currentAgeInMonths / 12;
            
            // 计算显示范围：当前年龄前后3岁，但在1-18岁范围内（以月为单位）
            let displayMinAge = Math.max(12, currentAgeInMonths - 36); // 至少从1岁开始
            let displayMaxAge = Math.min(216, currentAgeInMonths + 36); // 最多到18岁
            
            // 确保最小范围至少有3岁（36个月）
            if (displayMaxAge - displayMinAge < 36) {
                if (displayMinAge <= 12) {
                    displayMaxAge = Math.min(216, displayMinAge + 36);
                } else {
                    displayMinAge = Math.max(12, displayMaxAge - 36);
                }
            }
            
            // 取整到完整年份
            displayMinAge = Math.floor(displayMinAge / 12) * 12;
            displayMaxAge = Math.ceil(displayMaxAge / 12) * 12;
            displayMaxAge = Math.min(216, displayMaxAge);
            
            // 计算每条记录对应的年龄（月份）
            const recordsWithAge = records.map(record => {
                const ageInMonths = calculateAgeInMonths(kid.birthday, record.date);
                return { ...record, ageInMonths };
            });
            
            const ageRange = Math.max(displayMaxAge - displayMinAge, 1);
            
            // 计算国标数据的值范围
            const standardLevels = type === 'height' 
                ? ['short', 'low', 'normal', 'high']
                : ['thin', 'normal', 'heavy', 'obese'];
                
            const allValues = [];
            // 添加用户数据
            recordsWithAge.forEach(r => allValues.push(type === 'height' ? r.height : r.weight));
            // 添加国标数据
            for (let ageMonths = displayMinAge; ageMonths <= displayMaxAge; ageMonths += 3) {
                const ageYears = ageMonths / 12;
                standardLevels.forEach(level => {
                    allValues.push(getStandardValue(gender, type, ageYears, level));
                });
            }
            
            // 计算合理的Y轴范围
            const minValue = Math.min(...allValues);
            const maxValue = Math.max(...allValues);
            
            let yMin, yMax, interval;
            if (type === 'height') {
                // 身高：以5cm为间隔
                yMin = Math.floor(minValue / 5) * 5 - 5;
                yMax = Math.ceil(maxValue / 5) * 5 + 5;
                interval = 5;
                yMin = Math.max(40, yMin);
                yMax = Math.min(200, yMax);
            } else {
                // 体重：以2kg为间隔
                yMin = Math.floor(minValue / 2) * 2 - 2;
                yMax = Math.ceil(maxValue / 2) * 2 + 2;
                interval = 2;
                yMin = Math.max(5, yMin);
                yMax = Math.min(80, yMax);
            }
            
            // 确保至少有一定范围
            const minRange = type === 'height' ? 20 : 10;
            if (yMax - yMin < minRange) {
                yMax = yMin + minRange;
            }
            
            const yRange = yMax - yMin;
            
            const chartData = type === 'height' 
                ? { color: '#FF9A9E', varColor: 'var(--pink-primary)', min: yMin, max: yMax, range: yRange, unit: 'cm' }
                : { color: '#AED581', varColor: '#AED581', min: yMin, max: yMax, range: yRange, unit: 'kg' };
            
            // 更新Y轴标签（按间隔显示）
            const yLabels = [];
            for (let val = yMax; val >= yMin; val -= interval) {
                yLabels.push(val);
            }
            
            // 如果标签过多，适当调整
            const step = Math.ceil(yLabels.length / 6);
            const displayLabels = [];
            for (let i = 0; i < yLabels.length; i += step) {
                displayLabels.push(yLabels[i]);
            }
            
            // 确保至少有min和max
            if (displayLabels[0] !== yMax) displayLabels.unshift(yMax);
            if (displayLabels[displayLabels.length - 1] !== yMin) displayLabels.push(yMin);
            
            // 更新标签
            const labelElements = [
                document.getElementById('y-label-1'),
                document.getElementById('y-label-2'),
                document.getElementById('y-label-3'),
                document.getElementById('y-label-4'),
                document.getElementById('y-label-5'),
                document.getElementById('y-label-6')
            ];
            
            labelElements.forEach((el, idx) => {
                if (idx < displayLabels.length) {
                    el.textContent = displayLabels[idx];
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            });
            
            // 辅助函数：年龄转换为坐标
            function ageToX(ageMonths) {
                return padding + ((ageMonths - displayMinAge) / ageRange) * (containerWidth - padding * 2);
            }
            
            function valueToY(value) {
                return containerHeight - padding - ((value - chartData.min) / chartData.range) * (containerHeight - padding * 2);
            }
            
            // 计算用户数据点坐标
            const userPoints = recordsWithAge.map(record => {
                const x = ageToX(record.ageInMonths);
                const value = type === 'height' ? record.height : record.weight;
                const y = valueToY(value);
                return { x, y, value, date: record.date, ageInMonths: record.ageInMonths };
            });

            // 生成国标曲线点（每3个月一个点）
            const standardPoints = [];
            for (let ageMonths = displayMinAge; ageMonths <= displayMaxAge; ageMonths += 3) {
                const ageYears = ageMonths / 12;
                const x = ageToX(ageMonths);
                const levelData = {};
                standardLevels.forEach(level => {
                    const value = getStandardValue(gender, type, ageYears, level);
                    levelData[level] = {
                        value,
                        y: valueToY(value)
                    };
                });
                standardPoints.push({ x, ageMonths, ageYears, ...levelData });
            }

            let svgContent = `<defs>`;
            
            // 国标区域渐变定义
            if (type === 'height') {
                svgContent += `
                    <linearGradient id="standard-gradient-short" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#E57373;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#E57373;stop-opacity:0.1"/>
                    </linearGradient>
                    <linearGradient id="standard-gradient-low" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:0.1"/>
                    </linearGradient>
                    <linearGradient id="standard-gradient-normal" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.1"/>
                    </linearGradient>
                    <linearGradient id="standard-gradient-high" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:0.1"/>
                    </linearGradient>
                `;
            } else {
                svgContent += `
                    <linearGradient id="standard-gradient-thin" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#E57373;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#E57373;stop-opacity:0.1"/>
                    </linearGradient>
                    <linearGradient id="standard-gradient-normal" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.1"/>
                    </linearGradient>
                    <linearGradient id="standard-gradient-heavy" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:0.1"/>
                    </linearGradient>
                    <linearGradient id="standard-gradient-obese" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#EF5350;stop-opacity:0.2"/>
                        <stop offset="100%" style="stop-color:#EF5350;stop-opacity:0.1"/>
                    </linearGradient>
                `;
            }
            
            svgContent += `
                    <linearGradient id="user-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:${chartData.color};stop-opacity:0.4"/>
                        <stop offset="100%" style="stop-color:${chartData.color};stop-opacity:0"/>
                    </linearGradient>
                </defs>
            `;
            
            // 绘制国标区域（从低到高）
            if (standardPoints.length > 1) {
                if (type === 'height') {
                    // 矮小区域
                    let areaPath = `M ${standardPoints[0].x} ${containerHeight}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.short.y}`);
                    areaPath += ` L ${standardPoints[standardPoints.length - 1].x} ${containerHeight} Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-short);" d="${areaPath}"/>`;
                    
                    // 偏矮区域
                    areaPath = `M ${standardPoints[0].x} ${standardPoints[0].short.y}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.low.y}`);
                    standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.short.y}`);
                    areaPath += ` Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-low);" d="${areaPath}"/>`;
                    
                    // 标准区域
                    areaPath = `M ${standardPoints[0].x} ${standardPoints[0].low.y}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                    standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.low.y}`);
                    areaPath += ` Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-normal);" d="${areaPath}"/>`;
                    
                    // 超高区域
                    areaPath = `M ${standardPoints[0].x} ${standardPoints[0].normal.y}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.high.y}`);
                    standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                    areaPath += ` Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-high);" d="${areaPath}"/>`;
                    
                    // 国标线条
                    svgContent += `<path class="chart-line" style="stroke: #E57373; stroke-width: 1; stroke-dasharray: 4, 2;" d="${generateLinePath(standardPoints, 'short')}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: #FFB74D; stroke-width: 1; stroke-dasharray: 4, 2;" d="${generateLinePath(standardPoints, 'low')}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: #81C784; stroke-width: 2;" d="${generateLinePath(standardPoints, 'normal')}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: #64B5F6; stroke-width: 1; stroke-dasharray: 4, 2;" d="${generateLinePath(standardPoints, 'high')}"/>`;
                } else {
                    // 偏瘦区域
                    let areaPath = `M ${standardPoints[0].x} ${containerHeight}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.thin.y}`);
                    areaPath += ` L ${standardPoints[standardPoints.length - 1].x} ${containerHeight} Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-thin);" d="${areaPath}"/>`;
                    
                    // 标准区域
                    areaPath = `M ${standardPoints[0].x} ${standardPoints[0].thin.y}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                    standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.thin.y}`);
                    areaPath += ` Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-normal);" d="${areaPath}"/>`;
                    
                    // 超重区域
                    areaPath = `M ${standardPoints[0].x} ${standardPoints[0].normal.y}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.heavy.y}`);
                    standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                    areaPath += ` Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-heavy);" d="${areaPath}"/>`;
                    
                    // 肥胖区域
                    areaPath = `M ${standardPoints[0].x} ${standardPoints[0].heavy.y}`;
                    standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.obese.y}`);
                    standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.heavy.y}`);
                    areaPath += ` Z`;
                    svgContent += `<path style="fill: url(#standard-gradient-obese);" d="${areaPath}"/>`;
                    
                    // 国标线条
                    svgContent += `<path class="chart-line" style="stroke: #E57373; stroke-width: 1; stroke-dasharray: 4, 2;" d="${generateLinePath(standardPoints, 'thin')}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: #81C784; stroke-width: 2;" d="${generateLinePath(standardPoints, 'normal')}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: #FFB74D; stroke-width: 1; stroke-dasharray: 4, 2;" d="${generateLinePath(standardPoints, 'heavy')}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: #EF5350; stroke-width: 1; stroke-dasharray: 4, 2;" d="${generateLinePath(standardPoints, 'obese')}"/>`;
                }
            }

            // 绘制用户曲线
            if (userPoints.length > 0) {
                // 生成路径
                let pathD = `M ${userPoints[0].x} ${userPoints[0].y}`;
                for (let i = 1; i < userPoints.length; i++) {
                    const prev = userPoints[i - 1];
                    const curr = userPoints[i];
                    const cpX = (prev.x + curr.x) / 2;
                    pathD += ` Q ${cpX} ${prev.y}, ${cpX} ${(prev.y + curr.y) / 2}`;
                    pathD += ` Q ${cpX} ${curr.y}, ${curr.x} ${curr.y}`;
                }

                // 生成填充区域
                let areaD = pathD + ` L ${userPoints[userPoints.length - 1].x} ${containerHeight}`;
                areaD += ` L ${userPoints[0].x} ${containerHeight} Z`;

                svgContent += `<path class="chart-area" style="fill: url(#user-gradient);" d="${areaD}"/>`;
                svgContent += `<path class="chart-line" style="stroke: ${chartData.varColor}; stroke-width: 3;" d="${pathD}"/>`;

                // 添加数据点
                userPoints.forEach((point, index) => {
                    const isLatest = index === userPoints.length - 1;
                    const r = isLatest ? 10 : 6;
                    svgContent += `<circle class="${isLatest ? 'chart-point-highlight' : 'chart-point'}" cx="${point.x}" cy="${point.y}" r="${r}" style="fill: ${isLatest ? '#FFD54F' : chartData.varColor}; stroke: white; stroke-width: 2;"/>`;
                });
            }

            svg.innerHTML = svgContent;

            // 更新X轴标签（按1岁间隔显示）
            const xLabelsContainer = document.getElementById('chart-x-labels');
            
            let xLabelsHTML = '';
            // 按1岁间隔生成标签
            for (let ageMonths = displayMinAge; ageMonths <= displayMaxAge; ageMonths += 12) {
                const x = ageToX(ageMonths);
                const ageYears = Math.floor(ageMonths / 12);
                xLabelsHTML += `<span class="chart-x-label" style="position: absolute; left: ${x - 20}px; width: 40px; text-align: center;">${ageYears}岁</span>`;
            }
            
            xLabelsContainer.innerHTML = xLabelsHTML;
        }

        // 生成国标曲线路径
        function generateLinePath(points, level) {
            let pathD = `M ${points[0].x} ${points[0][level].y}`;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                const cpX = (prev.x + curr.x) / 2;
                pathD += ` Q ${cpX} ${prev[level].y}, ${cpX} ${(prev[level].y + curr[level].y) / 2}`;
                pathD += ` Q ${cpX} ${curr[level].y}, ${curr.x} ${curr[level].y}`;
            }
            return pathD;
        }

        // 全屏显示图表
        function openFullscreen(type) {
            const overlay = document.getElementById('fullscreen-overlay');
            const title = document.getElementById('fullscreen-title');
            const container = document.getElementById('fullscreen-chart-container');
            
            title.textContent = type === 'height' ? '身高' : '体重';
            
            // 生成全屏图表内容
            const chartData = type === 'height' 
                ? { color: '#FF9A9E', label: '身高', unit: 'cm', max: 150, id: 'fullscreen-height' }
                : { color: '#AED581', label: '体重', unit: 'kg', max: 50, id: 'fullscreen-weight' };
            
            // 先渲染全屏图表
            container.innerHTML = `
                <div class="chart-container" style="height: 100%; padding-top: 20px;">
                    <div class="chart-grid" id="${chartData.id}-grid">
                        <div class="chart-grid-line"></div>
                        <div class="chart-grid-line"></div>
                        <div class="chart-grid-line"></div>
                        <div class="chart-grid-line"></div>
                        <span class="chart-y-label" id="${chartData.id}-y1"></span>
                        <span class="chart-y-label" id="${chartData.id}-y2"></span>
                        <span class="chart-y-label" id="${chartData.id}-y3"></span>
                        <span class="chart-y-label" id="${chartData.id}-y4"></span>
                    </div>
                    <div class="chart-line-container">
                        <svg class="chart-svg" viewBox="0 0 600 300" preserveAspectRatio="none" id="${chartData.id}-svg" style="width:100%;height:100%;">
                        </svg>
                    </div>
                    <div class="chart-x-labels" id="${chartData.id}-x-labels"></div>
                </div>
            `;
            
            overlay.classList.add('active');
            
            // 更新全屏图表数据
            updateFullscreenChart(type, chartData);
        }

        // 更新全屏图表
        function updateFullscreenChart(type, chartData) {
            if (currentKidId && records[currentKidId] && records[currentKidId].length > 0) {
                const kidRecords = records[currentKidId].slice(0, 10).reverse();
                const svg = document.getElementById(`${chartData.id}-svg`);
                const containerWidth = 600;
                const containerHeight = 300;
                const padding = 40;
                
                // 获取当前孩子的出生日期和性别
                const kid = kids.find(k => k.id === currentKidId);
                if (!kid) return;
                const gender = kid.gender;
                
                // 计算当前年龄
                const currentAgeInMonths = calculateAgeInMonths(kid.birthday, new Date().toISOString().split('T')[0]);
                const currentAge = currentAgeInMonths / 12;
                
                // 计算显示范围：当前年龄前后3岁，但在1-18岁范围内（以月为单位）
                let displayMinAge = Math.max(12, currentAgeInMonths - 36); // 至少从1岁开始
                let displayMaxAge = Math.min(216, currentAgeInMonths + 36); // 最多到18岁
                
                // 确保最小范围至少有3岁（36个月）
                if (displayMaxAge - displayMinAge < 36) {
                    if (displayMinAge <= 12) {
                        displayMaxAge = Math.min(216, displayMinAge + 36);
                    } else {
                        displayMinAge = Math.max(12, displayMaxAge - 36);
                    }
                }
                
                // 取整到完整年份
                displayMinAge = Math.floor(displayMinAge / 12) * 12;
                displayMaxAge = Math.ceil(displayMaxAge / 12) * 12;
                displayMaxAge = Math.min(216, displayMaxAge);
                
                // 计算每条记录对应的年龄（月份）
                const recordsWithAge = kidRecords.map(record => {
                    const ageInMonths = calculateAgeInMonths(kid.birthday, record.date);
                    return { ...record, ageInMonths };
                });
                
                const ageRange = Math.max(displayMaxAge - displayMinAge, 1);
                
                // 计算国标数据的值范围
                const standardLevels = type === 'height' 
                    ? ['short', 'low', 'normal', 'high']
                    : ['thin', 'normal', 'heavy', 'obese'];
                    
                const allValues = [];
                // 添加用户数据
                recordsWithAge.forEach(r => allValues.push(type === 'height' ? r.height : r.weight));
                // 添加国标数据
                for (let ageMonths = displayMinAge; ageMonths <= displayMaxAge; ageMonths += 3) {
                    const ageYears = ageMonths / 12;
                    standardLevels.forEach(level => {
                        allValues.push(getStandardValue(gender, type, ageYears, level));
                    });
                }
                
                // 计算合理的Y轴范围
                const minValue = Math.min(...allValues);
                const maxValue = Math.max(...allValues);
                
                let yMin, yMax, interval;
                if (type === 'height') {
                    // 身高：以5cm为间隔
                    yMin = Math.floor(minValue / 5) * 5 - 5;
                    yMax = Math.ceil(maxValue / 5) * 5 + 5;
                    interval = 5;
                    yMin = Math.max(40, yMin);
                    yMax = Math.min(200, yMax);
                } else {
                    // 体重：以2kg为间隔
                    yMin = Math.floor(minValue / 2) * 2 - 2;
                    yMax = Math.ceil(maxValue / 2) * 2 + 2;
                    interval = 2;
                    yMin = Math.max(5, yMin);
                    yMax = Math.min(80, yMax);
                }
                
                // 确保至少有一定范围
                const minRange = type === 'height' ? 20 : 10;
                if (yMax - yMin < minRange) {
                    yMax = yMin + minRange;
                }
                
                const yRange = yMax - yMin;
                
                // 更新chartData
                chartData = {
                    ...chartData,
                    min: yMin,
                    max: yMax,
                    range: yRange
                };
                
                // 更新Y轴标签（按间隔显示）
                const yLabels = [];
                for (let val = yMax; val >= yMin; val -= interval) {
                    yLabels.push(val);
                }
                
                // 如果标签过多，适当调整
                const step = Math.ceil(yLabels.length / 4);
                const displayLabels = [];
                for (let i = 0; i < yLabels.length; i += step) {
                    displayLabels.push(yLabels[i]);
                }
                
                // 确保至少有min和max
                if (displayLabels[0] !== yMax) displayLabels.unshift(yMax);
                if (displayLabels[displayLabels.length - 1] !== yMin) displayLabels.push(yMin);
                
                // 更新标签
                document.getElementById(`${chartData.id}-y1`).textContent = displayLabels[0] || '';
                document.getElementById(`${chartData.id}-y2`).textContent = displayLabels[1] || '';
                document.getElementById(`${chartData.id}-y3`).textContent = displayLabels[2] || '';
                document.getElementById(`${chartData.id}-y4`).textContent = displayLabels[3] || '';
                
                // 辅助函数：年龄转换为坐标
                function ageToX(ageMonths) {
                    return padding + ((ageMonths - displayMinAge) / ageRange) * (containerWidth - padding * 2);
                }
                
                function valueToY(value) {
                    return containerHeight - padding - ((value - chartData.min) / chartData.range) * (containerHeight - padding * 2);
                }
                
                // 计算用户数据点坐标
                const userPoints = recordsWithAge.map(record => {
                    const x = ageToX(record.ageInMonths);
                    const value = type === 'height' ? record.height : record.weight;
                    const y = valueToY(value);
                    return { x, y, value, date: record.date, ageInMonths: record.ageInMonths };
                });

                // 生成国标曲线点（每3个月一个点）
                const standardPoints = [];
                for (let ageMonths = displayMinAge; ageMonths <= displayMaxAge; ageMonths += 3) {
                    const ageYears = ageMonths / 12;
                    const x = ageToX(ageMonths);
                    const levelData = {};
                    standardLevels.forEach(level => {
                        const value = getStandardValue(gender, type, ageYears, level);
                        levelData[level] = {
                            value,
                            y: valueToY(value)
                        };
                    });
                    standardPoints.push({ x, ageMonths, ageYears, ...levelData });
                }

                let svgContent = `<defs>`;
                
                // 国标区域渐变定义
                if (type === 'height') {
                    svgContent += `
                        <linearGradient id="standard-gradient-short" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#E57373;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#E57373;stop-opacity:0.1"/>
                        </linearGradient>
                        <linearGradient id="standard-gradient-low" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:0.1"/>
                        </linearGradient>
                        <linearGradient id="standard-gradient-normal" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.1"/>
                        </linearGradient>
                        <linearGradient id="standard-gradient-high" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:0.1"/>
                        </linearGradient>
                    `;
                } else {
                    svgContent += `
                        <linearGradient id="standard-gradient-thin" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#E57373;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#E57373;stop-opacity:0.1"/>
                        </linearGradient>
                        <linearGradient id="standard-gradient-normal" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.1"/>
                        </linearGradient>
                        <linearGradient id="standard-gradient-heavy" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:0.1"/>
                        </linearGradient>
                        <linearGradient id="standard-gradient-obese" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#EF5350;stop-opacity:0.2"/>
                            <stop offset="100%" style="stop-color:#EF5350;stop-opacity:0.1"/>
                        </linearGradient>
                    `;
                }
                
                svgContent += `
                        <linearGradient id="fullscreen-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:${chartData.color};stop-opacity:0.4"/>
                            <stop offset="100%" style="stop-color:${chartData.color};stop-opacity:0"/>
                        </linearGradient>
                    </defs>
                `;
                
                // 绘制国标区域（从低到高）
                if (standardPoints.length > 1) {
                    if (type === 'height') {
                        // 矮小区域
                        let areaPath = `M ${standardPoints[0].x} ${containerHeight}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.short.y}`);
                        areaPath += ` L ${standardPoints[standardPoints.length - 1].x} ${containerHeight} Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-short);" d="${areaPath}"/>`;
                        
                        // 偏矮区域
                        areaPath = `M ${standardPoints[0].x} ${standardPoints[0].short.y}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.low.y}`);
                        standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.short.y}`);
                        areaPath += ` Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-low);" d="${areaPath}"/>`;
                        
                        // 标准区域
                        areaPath = `M ${standardPoints[0].x} ${standardPoints[0].low.y}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                        standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.low.y}`);
                        areaPath += ` Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-normal);" d="${areaPath}"/>`;
                        
                        // 超高区域
                        areaPath = `M ${standardPoints[0].x} ${standardPoints[0].normal.y}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.high.y}`);
                        standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                        areaPath += ` Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-high);" d="${areaPath}"/>`;
                        
                        // 国标线条
                        svgContent += `<path class="chart-line" style="stroke: #E57373; stroke-width: 1.5; stroke-dasharray: 5, 3;" d="${generateLinePath(standardPoints, 'short')}"/>`;
                        svgContent += `<path class="chart-line" style="stroke: #FFB74D; stroke-width: 1.5; stroke-dasharray: 5, 3;" d="${generateLinePath(standardPoints, 'low')}"/>`;
                        svgContent += `<path class="chart-line" style="stroke: #81C784; stroke-width: 2.5;" d="${generateLinePath(standardPoints, 'normal')}"/>`;
                        svgContent += `<path class="chart-line" style="stroke: #64B5F6; stroke-width: 1.5; stroke-dasharray: 5, 3;" d="${generateLinePath(standardPoints, 'high')}"/>`;
                    } else {
                        // 偏瘦区域
                        let areaPath = `M ${standardPoints[0].x} ${containerHeight}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.thin.y}`);
                        areaPath += ` L ${standardPoints[standardPoints.length - 1].x} ${containerHeight} Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-thin);" d="${areaPath}"/>`;
                        
                        // 标准区域
                        areaPath = `M ${standardPoints[0].x} ${standardPoints[0].thin.y}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                        standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.thin.y}`);
                        areaPath += ` Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-normal);" d="${areaPath}"/>`;
                        
                        // 超重区域
                        areaPath = `M ${standardPoints[0].x} ${standardPoints[0].normal.y}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.heavy.y}`);
                        standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.normal.y}`);
                        areaPath += ` Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-heavy);" d="${areaPath}"/>`;
                        
                        // 肥胖区域
                        areaPath = `M ${standardPoints[0].x} ${standardPoints[0].heavy.y}`;
                        standardPoints.forEach(p => areaPath += ` L ${p.x} ${p.obese.y}`);
                        standardPoints.slice().reverse().forEach(p => areaPath += ` L ${p.x} ${p.heavy.y}`);
                        areaPath += ` Z`;
                        svgContent += `<path style="fill: url(#standard-gradient-obese);" d="${areaPath}"/>`;
                        
                        // 国标线条
                        svgContent += `<path class="chart-line" style="stroke: #E57373; stroke-width: 1.5; stroke-dasharray: 5, 3;" d="${generateLinePath(standardPoints, 'thin')}"/>`;
                        svgContent += `<path class="chart-line" style="stroke: #81C784; stroke-width: 2.5;" d="${generateLinePath(standardPoints, 'normal')}"/>`;
                        svgContent += `<path class="chart-line" style="stroke: #FFB74D; stroke-width: 1.5; stroke-dasharray: 5, 3;" d="${generateLinePath(standardPoints, 'heavy')}"/>`;
                        svgContent += `<path class="chart-line" style="stroke: #EF5350; stroke-width: 1.5; stroke-dasharray: 5, 3;" d="${generateLinePath(standardPoints, 'obese')}"/>`;
                    }
                }

                // 绘制用户曲线
                if (userPoints.length > 0) {
                    // 生成路径
                    let pathD = `M ${userPoints[0].x} ${userPoints[0].y}`;
                    for (let i = 1; i < userPoints.length; i++) {
                        const prev = userPoints[i - 1];
                        const curr = userPoints[i];
                        const cpX = (prev.x + curr.x) / 2;
                        pathD += ` Q ${cpX} ${prev.y}, ${cpX} ${(prev.y + curr.y) / 2}`;
                        pathD += ` Q ${cpX} ${curr.y}, ${curr.x} ${curr.y}`;
                    }

                    // 生成填充区域
                    let areaD = pathD + ` L ${userPoints[userPoints.length - 1].x} ${containerHeight}`;
                    areaD += ` L ${userPoints[0].x} ${containerHeight} Z`;

                    svgContent += `<path class="chart-area" style="fill: url(#fullscreen-gradient);" d="${areaD}"/>`;
                    svgContent += `<path class="chart-line" style="stroke: ${chartData.color}; stroke-width: 3.5;" d="${pathD}"/>`;

                    // 添加数据点
                    userPoints.forEach((point, index) => {
                        const isLatest = index === userPoints.length - 1;
                        const r = isLatest ? 14 : 8;
                        svgContent += `<circle class="${isLatest ? 'chart-point-highlight' : 'chart-point'}" cx="${point.x}" cy="${point.y}" r="${r}" style="fill: ${isLatest ? '#FFD54F' : chartData.color}; stroke: white; stroke-width: 2.5;"/>`;
                    });
                }

                svg.innerHTML = svgContent;

                // 更新X轴标签（按1岁间隔显示）
                const xLabelsContainer = document.getElementById(`${chartData.id}-x-labels`);
                
                let labelsHTML = '';
                // 按1岁间隔生成标签
                for (let ageMonths = displayMinAge; ageMonths <= displayMaxAge; ageMonths += 12) {
                    const x = ageToX(ageMonths);
                    const ageYears = Math.floor(ageMonths / 12);
                    labelsHTML += `<span class="chart-x-label" style="position: absolute; left: ${x - 30}px; width: 60px; text-align: center; font-size: 12px;">${ageYears}岁</span>`;
                }
                
                xLabelsContainer.innerHTML = labelsHTML;
            }
        }

        // 关闭全屏
        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').classList.remove('active');
        }

        function saveRecord() {
            const date = document.getElementById('record-date').value || new Date().toISOString().split('T')[0];
            const height = parseFloat(document.getElementById('record-height').value) || 0;
            const weight = parseFloat(document.getElementById('record-weight').value) || 0;
            const note = document.getElementById('record-note').value || '';
            
            if (height && weight && currentKidId) {
                if (!records[currentKidId]) {
                    records[currentKidId] = [];
                }
                records[currentKidId].unshift({ date, height, weight, note });
                updateHistoryList();
                updateHomePageData();
                alert('记录保存成功！');
                goToPage('home');
                document.getElementById('record-height').value = '';
                document.getElementById('record-weight').value = '';
                document.getElementById('record-note').value = '';
            } else {
                alert('请填写身高和体重！');
            }
        }

        function updateHistoryList() {
            const list = document.getElementById('history-list');
            const heightColor = currentTheme === 'pink' ? '#FF9A9E' : '#74B9FF';
            
            if (!currentKidId || !records[currentKidId]) {
                list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-light);">暂无记录</div>';
                return;
            }
            
            list.innerHTML = records[currentKidId].map(record => `
                <div class="history-item">
                    <div class="history-date">${record.date}</div>
                    <div class="history-data">
                        <div class="history-data-item">
                            <div class="history-data-label">身高</div>
                            <div class="history-data-value" style="color: ${heightColor};">${record.height}cm</div>
                        </div>
                        <div class="history-data-item">
                            <div class="history-data-label">体重</div>
                            <div class="history-data-value" style="color: #7CB342;">${record.weight}kg</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('record-date').value = new Date().toISOString().split('T')[0];
        
        // 初始化时设置当前孩子并更新首页数据
        currentKidId = kids[0].id;
        selectGender(currentTheme);
        updateAvatar();
        updateHomePageData();
        updateChart();
        
        // 确保底部导航栏可见
        document.querySelector('.bottom-nav').style.display = 'block';
        
        // 设置页面相关函数
        function goToSettingsPage() {
            goToPage('settings');
        }
        
        function backupData() {
            const data = {
                kids: kids,
                records: records,
                currentKidId: currentKidId,
                currentTheme: currentTheme,
                backupTime: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `宝宝成长记录备份_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
            alert('数据备份成功！文件已下载。');
        }
        
        function restoreData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const data = JSON.parse(event.target.result);
                        
                        if (data.kids && data.records) {
                            kids = data.kids;
                            records = data.records;
                            currentKidId = data.currentKidId || kids[0].id;
                            currentTheme = data.currentTheme || 'pink';
                            
                            document.body.className = currentTheme === 'pink' ? 'theme-pink' : 'theme-blue';
                            updateAvatar();
                            updateCharacterImage();
                            updateChartColor();
                            updateHomePageData();
                            renderKidsList();
                            
                            alert('数据还原成功！');
                            goToPage('home');
                        } else {
                            alert('无效的备份文件格式！');
                        }
                    } catch (error) {
                        alert('文件解析失败，请检查文件格式！');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
    </script>
</body>
</html>
