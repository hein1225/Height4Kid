name: height4kid
description: 儿童成长记录应用 - 身高体重跟踪与国标数据对比
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8          # 升至最新小版本
  provider: ^6.1.2                 # 升至最新小版本
  shared_preferences: ^2.3.5       # 升至最新
  intl: ^0.20.2                    # 保持（Flutter 3.44 配套）
  file_picker: 10.3.8
  path_provider: ^2.1.5
  file_saver: ^0.4.0
  permission_handler: ^11.4.0
  device_info_plus: ^11.0.0
  url_launcher: ^6.3.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0            # 升至 5.x（6.x 可能规则更严）
  flutter_launcher_icons: ^0.14.4    # 升至最新

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/软件图标.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/软件图标.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/